name: Online operations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ops-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the operations tooling
        run: node --test deploy/runtime-grants.test.mjs scripts/online/online-ops.test.mjs
      - name: Verify the local fixture
        run: go test -tags onlinefixture -count=1 ./tools/onlinefixture
      - name: Audit the least-privilege runtime grants
        run: node deploy/runtime-grants.mjs --check
      - name: Audit the production wiring of the feature switches
        run: node scripts/online/service-wiring.mjs
      - name: Audit the backup coverage and the removal ledger
        run: node scripts/online/backup-coverage.mjs
      - name: Audit the recorded evidence
        run: node scripts/online/evidence-ledger.mjs
      - name: Evaluate the friend release gate
        run: node scripts/online/feature-gates.mjs evaluate --gate friend || true
      - name: Print the friend rollout packet
        run: node scripts/online/feature-gates.mjs packet --gate friend

  runtime-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: pnpm build:rules-worker
      - name: Build and verify the deployment runtime image locally
        run: node deploy/verify-runtime-image.mjs

  # The container proofs of the fence, the compose configuration and the
  # native restore. They need a real PostgreSQL and a real container runtime,
  # and the helpers of the proofs reach the published port of the database
  # through host.docker.internal, which a Linux engine resolves only with the
  # mapping the proofs pass.
  container-proofs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: kamkmchess_probe
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: kamkmchess_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kamkmchess_probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ONLINE_FIXTURE_CONTAINER: kamkmchess-fixture
      ONLINE_FIXTURE_DATABASE_URL: postgres://kamkmchess_probe:fixture-only@127.0.0.1:5432/kamkmchess_probe?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Start the fixture database of the proofs
        run: |
          docker run --detach --name "$ONLINE_FIXTURE_CONTAINER" \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=kamkmchess_probe \
            --env POSTGRES_PASSWORD=fixture-only \
            --env POSTGRES_DB=kamkmchess_probe \
            postgres:17.6
      - name: Wait for the fixture database
        run: |
          for attempt in $(seq 1 60); do
            if docker exec "$ONLINE_FIXTURE_CONTAINER" pg_isready -U kamkmchess_probe -d kamkmchess_probe; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Prove the compose configuration of the database service
        run: node deploy/verify-compose-config.mjs
      - name: Prove the shared ownership of the durable restore fence
        run: node deploy/verify-fence-access.mjs
      - name: Prove the native restore lifecycle
        run: node scripts/online/restore-proof.mjs
      - name: Remove the fixture database of the proofs
        if: always()
        run: docker rm --force "$ONLINE_FIXTURE_CONTAINER" || true

  grant-probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: kamkmchess_probe
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: kamkmchess_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kamkmchess_probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PSQL_PATH: psql
      ONLINE_FIXTURE_DATABASE_URL: postgres://kamkmchess_probe:fixture-only@127.0.0.1:5432/kamkmchess_probe?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Execute the runtime role grants against a real PostgreSQL
        run: node deploy/runtime-grants-probe.mjs --database-url "$ONLINE_FIXTURE_DATABASE_URL"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: kamkmchess_online_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ONLINE_FIXTURE_DATABASE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/kamkmchess_online_test?sslmode=disable
      KHA41_TEST_DATABASE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/kamkmchess_online_test?sslmode=disable
      KHA41_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: pnpm build:rules-worker
      - name: Run the local integration suite against a real PostgreSQL
        run: node scripts/online/integration-suite.mjs --no-record
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-integration-report
          path: docs/evidence/online/KHA-80-integration.json
          if-no-files-found: ignore
          retention-days: 7
