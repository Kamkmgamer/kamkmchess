name: kamkmchess

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: postgres.env
    networks:
      default:
        aliases:
          - chess-db.agent.soft-magic.com
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tls:/tls:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./bin:/opt/kamkmchess:ro
      - ./backups:/backups
      - ./backup.env:/run/secrets/backup.env:ro
      # The durable restore fence. The restore command writes and clears it
      # here, and the API reads the same file from the same volume. A fence
      # inside the database schema would be replaced by the restore it has to
      # guard, and a container-local file would not survive a restart.
      - restorefence:/var/lib/kamkmchess/restore-fence
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=60
      - -c
      - shared_buffers=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  # The durable restore fence is shared with the API container. Both must see
  # the same file, and it must outlive a container restart.
  restorefence:
