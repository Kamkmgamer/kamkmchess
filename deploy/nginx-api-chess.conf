server {
    listen 80;
    server_name api.chess.khalil.mageed.net;
    location ^~ /.well-known/acme-challenge/ { root /var/www/kamkmchess-acme; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name api.chess.khalil.mageed.net;
    ssl_certificate /etc/letsencrypt/live/api.chess.khalil.mageed.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chess.khalil.mageed.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }
}
