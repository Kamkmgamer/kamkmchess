# Administrative commands use the container's local socket.
local all all trust
# Reject cleartext network sessions before considering password authentication.
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
# Backup administration is confined to loopback inside this container.
hostssl all kamkmchess_migrator 127.0.0.1/32 scram-sha-256
hostssl all kamkmchess_migrator ::1/128 scram-sha-256
hostssl kamkmchess kamkmchess_runtime 0.0.0.0/0 scram-sha-256
hostssl kamkmchess kamkmchess_runtime ::/0 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
