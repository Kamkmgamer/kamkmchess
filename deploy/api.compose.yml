services:
  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    image: kamkmchess-api:local
    restart: unless-stopped
    env_file: api.env
    environment:
      # The private rules process runs inside the API container on the pinned
      # Node runtime. The path is fixed by the image and is not configurable
      # per deployment, so a missing bundle cannot start the composition.
      ONLINE_RULES_WORKER_ENTRY: /opt/kamkmchess/rules-worker/worker.mjs
      # The durable restore fence. The restore command writes the marker
      # directory of the fence into the shared volume and clears it only after
      # the removal ledger was applied. The API observes the same marker
      # directory from the same volume and refuses to serve while it exists;
      # it never reads the owner marker. The server must load this setting; an
      # ignored setting silently disables the fence.
      ONLINE_RESTORE_FENCE_PATH: /var/lib/kamkmchess/restore-fence
    volumes:
      # Read-only for the API: the service only reads the fence. The restore
      # command writes and clears it in the database container.
      - restorefence:/var/lib/kamkmchess/restore-fence:ro
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/games)\" = 401 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
